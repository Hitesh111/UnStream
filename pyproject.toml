[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fiio-library-manager"
version = "0.1.0"
description = "Local Hi-Fi music library manager for Spotify discovery and FiiO SNOWSKY Echo Mini sync"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Personal Hi-Fi Library" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "mutagen>=1.47",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6"]
fixtures = ["soundfile>=0.12"]
torrent = ["libtorrent>=2.0.11"]

[project.scripts]
musicctl = "fiiolib.cli.main:run"
torrent-fetch = "fiiolib.torrent_fetch:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fiiolib = ["db/*.sql", "dashboard/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]
